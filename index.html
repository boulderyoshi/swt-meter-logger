<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SWT Thickness Logger</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>SWT Logger</h1>
        <span>v0.9</span>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙</button>
    </header>

    <section class="work-card">
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" playsinline muted></video>
        <div class="roi" id="roi" aria-label="OCR読み取り範囲"></div>

        <button id="roiAdjustBtn" class="camera-overlay-btn">範囲調整</button>

        <div class="ocr-mini" aria-label="OCRプレビュー">
          <div class="ocr-mini-title">OCR</div>
          <canvas id="debugCanvas"></canvas>
          <strong id="ocrMiniText">--</strong>
        </div>
      </div>

      <div id="roiAdjustPanel" class="roi-adjust-panel hidden-field">
        <div class="roi-adjust-head">
          <strong>OCR範囲調整</strong>
          <button id="roiAdjustCloseBtn" class="small-btn">閉じる</button>
        </div>
        <div class="roi-grid">
          <label>横位置 <span id="roiXLabel">50%</span><input id="roiX" type="range" min="10" max="90" value="50" /></label>
          <label>縦位置 <span id="roiYLabel">56%</span><input id="roiY" type="range" min="15" max="85" value="56" /></label>
          <label>幅 <span id="roiWLabel">62%</span><input id="roiW" type="range" min="20" max="95" value="62" /></label>
          <label>高さ <span id="roiHLabel">24%</span><input id="roiH" type="range" min="10" max="70" value="24" /></label>
        </div>
      </div>

      <div class="primary-actions">
        <button id="cameraBtn" class="primary">カメラ接続</button>
        <button id="readBtn" class="primary" disabled>自動読み取り開始</button>
      </div>

      <div class="reading-panel">
        <div class="current-reading">
          <span id="currentReadingLabel">現在値</span>
          <strong id="currentValue">--.-</strong>
          <b id="currentUnit">µm</b>
        </div>
        <div class="destination">
          <span>保存先</span>
          <strong id="targetLine">1行 / 1列</strong>
        </div>
      </div>

      <div class="status-strip">
        <span id="status">待機中</span>
        <span>信頼度 <b id="confidence">--</b></span>
        <span>保存 <b id="recordCount">0</b></span>
      </div>
    </section>

    <section class="recent-card">
      <div class="section-head">
        <h2>最近の記録</h2>
        <button id="undoBtn" class="small-btn" disabled>1つ戻す</button>
      </div>
      <div class="recent-table-wrap">
        <table id="recentTable">
          <thead>
            <tr><th id="recentHeadTime">時間</th><th id="recentHeadCol">列</th><th id="recentHeadRow">行</th><th id="recentHeadValue">値</th></tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </section>

    <section class="export-card">
      <div class="section-head">
        <h2>出力</h2>
        <span id="exportSummary">記録なし</span>
      </div>
      <div class="export-actions">
        <button id="shareBtn" class="primary" disabled>共有</button>
        <button id="saveBtn" disabled>ファイル保存</button>
      </div>
      <div class="last-line">最終記録 <b id="lastTime">--:--:--</b></div>
    </section>

    <details class="table-preview-card" id="tablePreviewDetails">
      <summary>表形式プレビュー</summary>
      <div class="table-wrap">
        <table id="previewTable"></table>
      </div>
    </details>

    <div id="settingsModal" class="modal-backdrop hidden-field" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="settingsTitle">設定</h2>
          <button id="settingsCloseBtn" class="icon-btn" aria-label="閉じる">×</button>
        </div>

        <div id="settingsRunningNote" class="running-note hidden-field">
          自動読み取り中は読み取り方式・出力形式を変更できません。停止すると変更できます。
        </div>

        <section class="modal-section">
          <h3>読み取り</h3>
          <div class="settings-grid">
            <label>
              読み取り対象
              <select id="scanTarget">
                <option value="number" selected>数字OCR</option>
                <option value="qr">QR管理番号</option>
              </select>
            </label>

            <label id="readModeField">
              読み取り方法
              <select id="readMode">
                <option value="auto" selected>自動読み取り</option>
                <option value="manual">手動読み取り</option>
              </select>
            </label>

            <label id="autoTriggerField">
              自動読み取り条件
              <select id="autoTrigger">
                <option value="change" selected>画面の変化に連動</option>
                <option value="interval">時間間隔</option>
              </select>
            </label>

            <label id="intervalField" class="hidden-field">
              時間間隔
              <select id="intervalSec">
                <option value="1">1秒</option>
                <option value="5">5秒</option>
                <option value="10" selected>10秒</option>
                <option value="30">30秒</option>
                <option value="60">60秒</option>
              </select>
            </label>
          </div>
          <p id="qrModeHint" class="setup-hint hidden-field">QR管理番号モードは、カメラをQRへ順番に向けるだけで連続登録します。同じ管理番号は重複登録しません。</p>
        </section>

        <section class="modal-section" id="outputSettingsSection">
          <h3>出力形式</h3>
          <label class="block-label">
            形式
            <select id="outputMode">
              <option value="simple" selected>シンプルCSV（1行）</option>
              <option value="table">表形式</option>
            </select>
          </label>

          <div id="tableSettings" class="hidden-field">
            <div class="dimension-card">
              <div class="dimension-head">
                <strong>列</strong>
                <label class="toggle-label"><input id="fixedColumns" type="checkbox" checked /> 列数を指定</label>
              </div>
              <label id="columnCountField">
                列数
                <input id="columnCount" type="number" inputmode="numeric" min="1" max="200" value="3" />
              </label>
              <label>
                列ヘッダー
                <select id="columnHeaderMode">
                  <option value="none">なし</option>
                  <option value="auto" selected>自動採番</option>
                  <option value="custom">任意入力</option>
                </select>
              </label>
              <label id="columnHeadersField" class="hidden-field wide">
                列ヘッダー名
                <input id="columnHeaders" type="text" value="1回目,2回目,3回目" placeholder="例：1回目,2回目,3回目" />
                <small>カンマ区切り</small>
              </label>
            </div>

            <div class="dimension-card">
              <div class="dimension-head">
                <strong>行</strong>
                <label class="toggle-label"><input id="fixedRows" type="checkbox" checked /> 行数を指定</label>
              </div>
              <label id="rowCountField">
                行数
                <input id="rowCount" type="number" inputmode="numeric" min="1" max="1000" value="3" />
              </label>
              <label>
                行ヘッダー
                <select id="rowHeaderMode">
                  <option value="none">なし</option>
                  <option value="auto">自動採番</option>
                  <option value="custom" selected>任意入力</option>
                </select>
              </label>
              <label id="rowHeadersField" class="wide">
                行ヘッダー名
                <textarea id="rowHeaders" rows="3" placeholder="1行に1つ">A
B
C</textarea>
                <small>改行またはカンマ区切り</small>
              </label>
            </div>

            <label id="cornerHeaderField" class="block-label">
              左上見出し
              <input id="cornerHeader" type="text" value="場所" placeholder="例：場所" />
            </label>

            <p id="fillRuleHint" class="setup-hint"></p>
          </div>
        </section>

        <details class="advanced-details" id="numericAdvancedSettings">
          <summary>高度な設定</summary>
          <div class="advanced-body">
            <div class="settings-grid">
              <label>
                変化検出感度
                <select id="changeSensitivity">
                  <option value="high">高い</option>
                  <option value="normal" selected>標準</option>
                  <option value="low">低い</option>
                </select>
              </label>

              <label>
                小数桁
                <select id="decimalPlaces">
                  <option value="1" selected>1桁固定</option>
                  <option value="auto">自動</option>
                  <option value="0">整数</option>
                  <option value="2">2桁固定</option>
                </select>
              </label>

              <label>
                単位
                <select id="unit">
                  <option value="µm" selected>µm</option>
                  <option value="mm">mm</option>
                </select>
              </label>
            </div>

            <div class="diagnostics">
              <progress id="ocrProgress" max="1" value="0"></progress>
              <p id="ocrText">OCR未実行</p>
            </div>
          </div>
        </details>
      </div>
    </div>

    <canvas id="captureCanvas" hidden></canvas>
    <canvas id="ocrCanvas" hidden></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./vendor/qr-scanner.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="./app.js"></script>
</body>
</html>
