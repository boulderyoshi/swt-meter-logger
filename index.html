<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SWT Thickness Logger</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>SWT Thickness Logger</h1>
      <p>Safari専用・SANKO SWT液晶向けOCR v0.2</p>
    </header>

    <section class="camera-card">
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" playsinline muted></video>
        <div class="roi" id="roi" aria-label="OCR読み取り範囲"></div>
      </div>
      <div class="camera-actions">
        <button id="startCameraBtn" class="primary">カメラ開始</button>
        <button id="flipBtn" disabled>背面カメラ再選択</button>
      </div>
      <p class="hint">白枠には数字と小数点だけを入れてください。上の「試材」や下の「µm」は外します。</p>
    </section>

    <section class="controls-card">
      <div class="field-grid">
        <label>
          記録間隔
          <select id="intervalSec">
            <option value="1">1秒</option>
            <option value="5">5秒</option>
            <option value="10" selected>10秒</option>
            <option value="30">30秒</option>
            <option value="60">60秒</option>
          </select>
        </label>
        <label>
          単位
          <select id="unit">
            <option value="µm" selected>µm</option>
            <option value="mm">mm</option>
          </select>
        </label>
      </div>

      <div class="slider-block">
        <label>読取枠 幅 <span id="roiWLabel">62%</span></label>
        <input id="roiW" type="range" min="30" max="90" value="62" />
      </div>
      <div class="slider-block">
        <label>読取枠 高さ <span id="roiHLabel">24%</span></label>
        <input id="roiH" type="range" min="12" max="50" value="24" />
      </div>
      <div class="slider-block">
        <label>読取枠 縦位置 <span id="roiYLabel">56%</span></label>
        <input id="roiY" type="range" min="30" max="75" value="56" />
      </div>

      <div class="measure-actions">
        <button id="singleBtn" disabled>1回読む</button>
        <button id="startBtn" class="primary" disabled>連続記録開始</button>
        <button id="stopBtn" class="danger" disabled>停止</button>
      </div>
    </section>

    <section class="status-card">
      <div class="current-value">
        <span class="label">現在値</span>
        <strong id="currentValue">--.-</strong>
        <span id="currentUnit">µm</span>
      </div>
      <div class="stats">
        <div><span>状態</span><strong id="status">待機中</strong></div>
        <div><span>認識信頼度</span><strong id="confidence">--</strong></div>
        <div><span>記録数</span><strong id="recordCount">0</strong></div>
        <div><span>最終記録</span><strong id="lastTime">--:--:--</strong></div>
      </div>
      <progress id="ocrProgress" max="1" value="0"></progress>
      <p id="ocrText" class="ocr-text"></p>
      <details>
        <summary>OCRが見ている画像</summary>
        <canvas id="debugCanvas"></canvas>
      </details>
    </section>

    <section class="log-card">
      <div class="log-head">
        <h2>記録</h2>
        <button id="csvBtn" disabled>CSV保存</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>時刻</th><th>値</th><th>状態</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </section>

    <canvas id="captureCanvas" hidden></canvas>
    <canvas id="ocrCanvas" hidden></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
