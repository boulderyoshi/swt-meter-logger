<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SWT Logger" />
  <meta name="theme-color" content="#0a84ff" />
  <meta name="description" content="iPhoneのカメラで機器の数字表示やQRコードを読み取り、CSVへ記録・共有するWebロガー。" />
  <title>SWT Logger</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1.0.2" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=1.0.2" />
  <link rel="icon" type="image/png" href="./assets/icon-192.png?v=1.0.2" />
  <link rel="stylesheet" href="./styles.css?v=1.0.3" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand"><h1>SWT Logger</h1><span>v1.0.4</span></div>
      <nav class="top-menu" aria-label="設定メニュー">
        <button class="menu-tab" data-menu="target">読取対象</button>
        <button class="menu-tab" data-menu="roi">読取範囲</button>
        <button class="menu-tab" data-menu="method">読取方式</button>
        <button class="menu-tab" data-menu="output">出力方法</button>
      </nav>
      <div class="settings-overview" aria-label="現在の設定">
        <div class="settings-overview-head">
          <strong>現在設定</strong>
          <button id="resetSettingsBtn" class="reset-settings-btn">デフォルトに戻す</button>
        </div>
        <div class="settings-summary">
          <span id="summaryTarget">対象: --</span>
          <span id="summaryRoi">範囲: --</span>
          <span id="summaryMethod">方式: --</span>
          <span id="summaryOutput">出力: --</span>
        </div>
      </div>
    </header>

    <section class="work-card">
      <div class="menu-stage">
        <section class="menu-panel hidden-field" data-panel="target">
          <h2>読取対象</h2>
          <label class="radio-row"><input type="radio" name="scanTarget" value="number" checked /> 数字</label>
          <div id="numberOptions" class="nested-options">
            <label class="radio-row"><input type="radio" name="numberMode" value="integer" checked /> 整数</label>
            <label class="radio-row"><input type="radio" name="numberMode" value="decimal" /> 小数点</label>
            <label id="decimalDigitsField" class="sub-field hidden-field">
              桁数
              <select id="decimalDigits">
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>
          <label class="radio-row"><input type="radio" name="scanTarget" value="qr" /> QRコード</label>
          <div class="menu-actions">
            <button class="close-menu-btn">閉じる</button>
          </div>
        </section>

        <section class="menu-panel hidden-field" data-panel="roi">
          <h2>読取範囲調整</h2>
          <div class="roi-grid">
            <label>横位置 <span id="roiXLabel">50%</span><input id="roiX" type="range" min="5" max="95" value="50" /></label>
            <label>縦位置 <span id="roiYLabel">56%</span><input id="roiY" type="range" min="5" max="95" value="56" /></label>
            <label>枠の横幅 <span id="roiWLabel">62%</span><input id="roiW" type="range" min="10" max="95" value="62" /></label>
            <label>枠の縦幅 <span id="roiHLabel">24%</span><input id="roiH" type="range" min="8" max="90" value="24" /></label>
          </div>
          <div class="menu-actions">
            <button class="close-menu-btn">閉じる</button>
          </div>
        </section>

        <section class="menu-panel hidden-field" data-panel="method">
          <h2>読取方式</h2>
          <label class="radio-row"><input type="radio" name="readMode" value="manual" /> 手動</label>
          <label class="radio-row"><input type="radio" name="readMode" value="auto" checked /> 自動</label>
          <div id="autoOptions" class="nested-options">
            <label class="radio-row"><input type="radio" name="autoTrigger" value="change" checked /> 画面変化式</label>
            <label class="radio-row"><input type="radio" name="autoTrigger" value="timer" /> タイマー式</label>
            <label id="timerSecondsField" class="sub-field hidden-field">
              時間選択（1～300秒）
              <input id="timerSeconds" type="number" inputmode="numeric" min="1" max="300" step="1" value="5" />
            </label>
          </div>
          <div class="menu-actions">
            <button class="close-menu-btn">閉じる</button>
          </div>
        </section>

        <section class="menu-panel hidden-field" data-panel="output">
          <h2>出力方法</h2>
          <label class="radio-row"><input type="radio" name="outputMode" value="one-line" checked /> 1列</label>
          <label class="radio-row"><input type="radio" name="outputMode" value="table" /> 表形式</label>

          <div id="tableOptions" class="nested-options hidden-field">
            <div class="check-setting">
              <label class="check-row"><input id="useColumns" type="checkbox" /> 横（列数）</label>
              <input id="columnCount" type="number" inputmode="numeric" min="1" step="1" value="1" />
            </div>
            <div class="check-setting">
              <label class="check-row"><input id="useRows" type="checkbox" /> 縦（行）</label>
              <input id="rowCount" type="number" inputmode="numeric" min="1" step="1" value="1" />
            </div>
            <label class="check-row"><input id="allowGaps" type="checkbox" /> 空白・任意改行を許可</label>
            <p class="menu-hint">表のヘッダーは行・列とも自動採番します。行数を指定した場合、指定行数を超えると読み取りを停止します。</p>
          </div>

          <div class="menu-actions">
            <button class="close-menu-btn">閉じる</button>
          </div>
        </section>
      </div>

      <div class="camera-wrap" id="cameraWrap">
        <video id="video" playsinline muted></video>
        <div class="roi" id="roi" aria-label="読み取り範囲"></div>
        <div id="testBadge" class="test-badge hidden-field">テストモード</div>

        <div class="ocr-mini" id="ocrMini" aria-label="OCRプレビュー">
          <div class="ocr-mini-title">OCR</div>
          <canvas id="debugCanvas"></canvas>
          <strong id="ocrMiniText">--</strong>
        </div>
      </div>

      <div class="control-panel">
        <div class="step-guide">
          <span id="stepCamera" class="step active">1 カメラ接続</span>
          <span class="arrow">→</span>
          <span id="stepRead" class="step">2 読み取り開始</span>
        </div>

        <div class="primary-actions">
          <button id="cameraBtn" class="primary">カメラ接続</button>
          <button id="readBtn" class="primary" disabled>自動読み取り開始</button>
        </div>

        <button id="testModeBtn" class="test-mode-btn">テストモード</button>

        <div id="gapActions" class="gap-actions hidden-field">
          <button id="blankBtn">空白</button>
          <button id="nextRowBtn">改行（次の行）</button>
        </div>

        <div class="reading-panel">
          <div class="current-reading">
            <span id="currentReadingLabel">現在値</span>
            <strong id="currentValue">--</strong>
            <b id="currentUnit"></b>
          </div>
          <div class="destination">
            <span>保存先</span>
            <strong id="targetLine">1行 / 1列</strong>
          </div>
        </div>

        <div class="status-strip">
          <span id="status">待機中</span>
          <span>信頼度 <b id="confidence">--</b></span>
          <span>保存 <b id="recordCount">0</b></span>
        </div>
      </div>
    </section>

    <section class="recent-card">
      <div class="section-head">
        <h2>最近の記録</h2>
        <button id="undoBtn" class="small-btn" disabled>1つ戻す</button>
      </div>
      <div class="recent-table-wrap">
        <table id="recentTable">
          <thead><tr><th>時間</th><th>列</th><th>行</th><th>値</th></tr></thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </section>

    <section class="export-card">
      <div class="section-head">
        <h2>出力</h2>
        <span id="exportSummary">記録なし</span>
      </div>
      <div class="export-actions">
        <button id="shareBtn" class="primary" disabled>共有</button>
        <button id="saveBtn" disabled>ファイル保存</button>
      </div>
      <div class="last-line">最終記録 <b id="lastTime">--:--:--</b></div>
    </section>

    <details class="table-preview-card" id="tablePreviewDetails">
      <summary>表形式プレビュー</summary>
      <div class="table-wrap"><table id="previewTable"></table></div>
    </details>

    <details class="diagnostics-card">
      <summary>診断</summary>
      <div class="diagnostics">
        <progress id="ocrProgress" max="1" value="0"></progress>
        <p id="ocrText">OCR未実行</p>
      </div>
    </details>

    <canvas id="captureCanvas" hidden></canvas>
    <canvas id="ocrCanvas" hidden></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./vendor/qr-scanner.umd.min.js?v=1.0.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>
  <script src="./app.js?v=1.0.4"></script>
</body>
</html>
