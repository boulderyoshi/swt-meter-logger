<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SWT Thickness Logger</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>SWT Logger</h1>
      <span>v0.4</span>
    </header>

    <details class="settings-card" id="settingsDetails" open>
      <summary>初期設定・読み取り設定</summary>
      <div class="settings-body">
        <div class="field-grid">
          <label>
            出力形式
            <select id="outputFormat">
              <option value="log" selected>ログ表（日時・値・状態・メモ）</option>
              <option value="table">自由表（横方向に値を入れる）</option>
            </select>
          </label>

          <label id="tableHeadersField" class="wide hidden-field">
            自由表の列名
            <input id="tableHeaders" type="text" value="測定1,測定2,測定3" placeholder="例：左,中央,右" />
            <small>カンマ区切りで指定</small>
          </label>

          <label>
            記録方法
            <select id="recordMode">
              <option value="change" selected>表示が変わったら記録</option>
              <option value="interval">一定間隔で記録</option>
            </select>
          </label>

          <label>
            小数桁
            <select id="decimalPlaces">
              <option value="1" selected>1桁固定</option>
              <option value="auto">自動</option>
              <option value="0">整数</option>
              <option value="2">2桁固定</option>
            </select>
          </label>

          <label id="intervalField">
            記録間隔
            <select id="intervalSec">
              <option value="1">1秒</option>
              <option value="5">5秒</option>
              <option value="10" selected>10秒</option>
              <option value="30">30秒</option>
              <option value="60">60秒</option>
            </select>
          </label>

          <label id="sensitivityField">
            変化検出感度
            <select id="changeSensitivity">
              <option value="high">高い</option>
              <option value="normal" selected>標準</option>
              <option value="low">低い</option>
            </select>
          </label>

          <label>
            単位
            <select id="unit">
              <option value="µm" selected>µm</option>
              <option value="mm">mm</option>
            </select>
          </label>
        </div>

        <div class="roi-grid">
          <label>枠 幅 <span id="roiWLabel">62%</span><input id="roiW" type="range" min="30" max="90" value="62" /></label>
          <label>枠 高さ <span id="roiHLabel">24%</span><input id="roiH" type="range" min="12" max="50" value="24" /></label>
          <label>枠 縦位置 <span id="roiYLabel">56%</span><input id="roiY" type="range" min="30" max="75" value="56" /></label>
        </div>
      </div>
    </details>

    <section class="work-card">
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" playsinline muted></video>
        <div class="roi" id="roi" aria-label="OCR読み取り範囲"></div>
      </div>

      <div class="camera-line">
        <button id="startCameraBtn" class="primary">カメラ開始</button>
        <button id="flipBtn" disabled>背面カメラ再選択</button>
      </div>

      <div class="reading-line">
        <span class="reading-label">現在値</span>
        <strong id="currentValue">--.-</strong>
        <span id="currentUnit">µm</span>
      </div>

      <div class="status-line">
        <span id="status">待機中</span>
        <span>信頼度 <b id="confidence">--</b></span>
        <span>測定 <b id="recordCount">0</b></span>
      </div>

      <div class="measure-actions">
        <button id="singleBtn" disabled>1回読む</button>
        <button id="startBtn" class="primary" disabled>監視開始</button>
        <button id="stopBtn" class="danger" disabled>停止</button>
      </div>

      <div class="target-line" id="targetLine">出力先：ログ表</div>

      <div class="insert-box">
        <textarea id="noteText" rows="2" placeholder="任意文字列（セル内改行も可）"></textarea>
        <div class="insert-actions">
          <button id="insertTextBtn">文字を挿入</button>
          <button id="newRowBtn">改行（次の行）</button>
          <button id="csvBtn" disabled>CSV保存</button>
        </div>
      </div>

      <div class="last-line">最終記録 <b id="lastTime">--:--:--</b></div>
    </section>

    <details class="preview-card" id="previewDetails">
      <summary>出力プレビュー</summary>
      <div class="table-wrap">
        <table id="previewTable"></table>
      </div>
    </details>

    <details class="debug-card">
      <summary>OCR診断</summary>
      <progress id="ocrProgress" max="1" value="0"></progress>
      <p id="ocrText" class="ocr-text"></p>
      <canvas id="debugCanvas"></canvas>
    </details>

    <canvas id="captureCanvas" hidden></canvas>
    <canvas id="ocrCanvas" hidden></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
