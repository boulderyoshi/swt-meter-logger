<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SWT Thickness Logger</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>SWT Logger</h1>
      <span>v0.6</span>
    </header>

    <details class="setup-card" id="outputSettings" open>
      <summary>出力設定</summary>
      <div class="details-body">
        <label class="block-label">
          形式
          <select id="outputMode">
            <option value="simple" selected>シンプルCSV（1行）</option>
            <option value="table">表形式</option>
          </select>
        </label>

        <div id="tableSettings" class="hidden-field">
          <div class="dimension-card">
            <div class="dimension-head">
              <strong>列</strong>
              <label class="toggle-label"><input id="fixedColumns" type="checkbox" checked /> 列数を指定</label>
            </div>
            <label id="columnCountField">
              列数
              <input id="columnCount" type="number" inputmode="numeric" min="1" max="200" value="3" />
            </label>
            <label>
              列ヘッダー
              <select id="columnHeaderMode">
                <option value="none">なし</option>
                <option value="auto" selected>自動採番</option>
                <option value="custom">任意入力</option>
              </select>
            </label>
            <label id="columnHeadersField" class="hidden-field">
              列ヘッダー名
              <input id="columnHeaders" type="text" value="1回目,2回目,3回目" placeholder="例：1回目,2回目,3回目" />
              <small>カンマ区切り</small>
            </label>
          </div>

          <div class="dimension-card">
            <div class="dimension-head">
              <strong>行</strong>
              <label class="toggle-label"><input id="fixedRows" type="checkbox" checked /> 行数を指定</label>
            </div>
            <label id="rowCountField">
              行数
              <input id="rowCount" type="number" inputmode="numeric" min="1" max="1000" value="3" />
            </label>
            <label>
              行ヘッダー
              <select id="rowHeaderMode">
                <option value="none">なし</option>
                <option value="auto">自動採番</option>
                <option value="custom" selected>任意入力</option>
              </select>
            </label>
            <label id="rowHeadersField">
              行ヘッダー名
              <textarea id="rowHeaders" rows="3" placeholder="1行に1つ">A
B
C</textarea>
              <small>改行またはカンマ区切り</small>
            </label>
          </div>

          <label id="cornerHeaderField" class="block-label">
            左上見出し
            <input id="cornerHeader" type="text" value="場所" placeholder="例：場所" />
          </label>

          <p class="setup-hint" id="fillRuleHint"></p>
        </div>
      </div>
    </details>

    <section class="work-card">
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" playsinline muted></video>
        <div class="roi" id="roi" aria-label="OCR読み取り範囲"></div>

        <div class="ocr-mini" aria-label="OCRプレビュー">
          <div class="ocr-mini-title">OCR</div>
          <canvas id="debugCanvas"></canvas>
          <strong id="ocrMiniText">--</strong>
        </div>
      </div>

      <div class="camera-actions">
        <button id="startCameraBtn" class="primary">カメラ開始</button>
        <button id="flipBtn" disabled>背面カメラ再選択</button>
      </div>

      <div class="reading-panel">
        <div class="current-reading">
          <span>現在値</span>
          <strong id="currentValue">--.-</strong>
          <b id="currentUnit">µm</b>
        </div>
        <div class="destination">
          <span>保存先</span>
          <strong id="targetLine">CSV 1番目</strong>
        </div>
      </div>

      <div class="status-strip">
        <span id="status">待機中</span>
        <span>信頼度 <b id="confidence">--</b></span>
        <span>保存 <b id="recordCount">0</b></span>
      </div>

      <div class="measure-actions">
        <button id="singleBtn" disabled>1回読む</button>
        <button id="startBtn" class="primary" disabled>監視開始</button>
        <button id="stopBtn" class="danger" disabled>停止</button>
        <button id="undoBtn" disabled>1つ戻す</button>
      </div>

      <div class="export-actions">
        <button id="shareBtn" class="primary" disabled>共有</button>
        <button id="saveBtn" disabled>ファイル保存</button>
      </div>

      <div class="last-line">
        <span>最終記録 <b id="lastTime">--:--:--</b></span>
        <span id="undoHint"></span>
      </div>
    </section>

    <details class="advanced-card" id="advancedSettings">
      <summary>高度な設定</summary>
      <div class="details-body">
        <div class="advanced-grid">
          <label>
            記録方法
            <select id="recordMode">
              <option value="change" selected>表示が変わったら記録</option>
              <option value="interval">一定間隔で記録</option>
            </select>
          </label>

          <label id="intervalField">
            記録間隔
            <select id="intervalSec">
              <option value="1">1秒</option>
              <option value="5">5秒</option>
              <option value="10" selected>10秒</option>
              <option value="30">30秒</option>
              <option value="60">60秒</option>
            </select>
          </label>

          <label id="sensitivityField">
            変化検出感度
            <select id="changeSensitivity">
              <option value="high">高い</option>
              <option value="normal" selected>標準</option>
              <option value="low">低い</option>
            </select>
          </label>

          <label>
            小数桁
            <select id="decimalPlaces">
              <option value="1" selected>1桁固定</option>
              <option value="auto">自動</option>
              <option value="0">整数</option>
              <option value="2">2桁固定</option>
            </select>
          </label>

          <label>
            単位
            <select id="unit">
              <option value="µm" selected>µm</option>
              <option value="mm">mm</option>
            </select>
          </label>
        </div>

        <div class="roi-grid">
          <label>読取枠 幅 <span id="roiWLabel">62%</span><input id="roiW" type="range" min="30" max="90" value="62" /></label>
          <label>読取枠 高さ <span id="roiHLabel">24%</span><input id="roiH" type="range" min="12" max="50" value="24" /></label>
          <label>読取枠 縦位置 <span id="roiYLabel">56%</span><input id="roiY" type="range" min="30" max="75" value="56" /></label>
        </div>

        <div class="diagnostics">
          <progress id="ocrProgress" max="1" value="0"></progress>
          <p id="ocrText">OCR未実行</p>
        </div>
      </div>
    </details>

    <details class="preview-card" id="previewDetails">
      <summary>出力プレビュー</summary>
      <div class="table-wrap">
        <table id="previewTable"></table>
      </div>
    </details>

    <canvas id="captureCanvas" hidden></canvas>
    <canvas id="ocrCanvas" hidden></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
